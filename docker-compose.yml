services:
  taproom:
    build:
      # Docker clones this itself as the build context — no local checkout
      # needed on the host. Repo is public, so no GITHUB_TOKEN is needed in
      # the URL. `#main` pins the branch; `docker compose build` re-clones
      # and rebuilds from whatever main points to at the time.
      context: https://github.com/pvsleeper/taproom.git#main
    image: taproom:latest
    container_name: taproom
    restart: unless-stopped
    volumes:
      - ./appsettings.Local.json:/app/appsettings.Local.json:ro
      - /data/geoip:/data/geoip:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taproom.rule=Host(`taproom.venter.center`)"
      - "traefik.http.routers.taproom.entrypoints=websecure"
      - "traefik.http.routers.taproom.tls=true"
      - "traefik.http.routers.taproom.tls.certresolver=letsencrypt"
      - "traefik.http.routers.taproom.middlewares=local-only@file"
      - "traefik.http.services.taproom.loadbalancer.server.port=8080"
    networks:
      - t1_proxy

networks:
  t1_proxy:
    external: true
