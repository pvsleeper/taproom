services:
  taproom:
    build:
      # Docker clones this itself as the build context — no local checkout
      # needed on the host. Repo is public, so no GITHUB_TOKEN is needed in
      # the URL. `#main` pins the branch; `docker compose build` re-clones
      # and rebuilds from whatever main points to at the time.
      context: https://github.com/pvsleeper/taproom.git#main
    image: taproom:latest
    container_name: taproom
    restart: unless-stopped
    # All config is env-var driven (ASP.NET Core binds Taproom__Section__Key automatically) rather than a
    # mounted appsettings.Local.json, so there's no secrets file to keep in sync with this compose file —
    # everything lives in the gitignored .env next to it (see .env.example).
    environment:
      - Taproom__Omada__BaseUrl=${OMADA_BASE_URL}
      - Taproom__Omada__ClientId=${OMADA_CLIENT_ID}
      - Taproom__Omada__ClientSecret=${OMADA_CLIENT_SECRET}
      - Taproom__Omada__SiteName=${OMADA_SITE_NAME:-Default}
      - Taproom__Omada__AllowInvalidCertificate=${OMADA_ALLOW_INVALID_CERTIFICATE:-false}
      - Taproom__Opnsense__BaseUrl=${OPNSENSE_BASE_URL}
      - Taproom__Opnsense__ApiKey=${OPNSENSE_API_KEY}
      - Taproom__Opnsense__ApiSecret=${OPNSENSE_API_SECRET}
      - Taproom__Opnsense__AllowInvalidCertificate=${OPNSENSE_ALLOW_INVALID_CERTIFICATE:-false}
      - Taproom__Opnsense__DnsServer=${OPNSENSE_DNS_SERVER}
      - Taproom__Opnsense__LanInterface=${OPNSENSE_LAN_INTERFACE:-lan}
      - Taproom__Opnsense__WanInterface=${OPNSENSE_WAN_INTERFACE:-wan}
      - Taproom__Home__Latitude=${HOME_LATITUDE}
      - Taproom__Home__Longitude=${HOME_LONGITUDE}
      - Taproom__Home__Label=${HOME_LABEL:-Home}
      # Fixed to match the volume mount below, not meant to be overridden per-deployment.
      - Taproom__GeoIp__CityDbPath=/data/geoip/GeoLite2-City.mmdb
      - Taproom__GeoIp__AsnDbPath=/data/geoip/GeoLite2-ASN.mmdb
    volumes:
      - /data/geoip:/data/geoip:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taproom.rule=Host(`taproom.venter.center`)"
      - "traefik.http.routers.taproom.entrypoints=websecure"
      - "traefik.http.routers.taproom.tls=true"
      - "traefik.http.routers.taproom.tls.certresolver=letsencrypt"
      - "traefik.http.routers.taproom.middlewares=local-only@file"
      - "traefik.http.services.taproom.loadbalancer.server.port=8080"
    networks:
      - t1_proxy

networks:
  t1_proxy:
    external: true
